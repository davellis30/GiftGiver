<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Suggester - GiftGiver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #e91e63 0%, #9c27b0 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-number {
            background: linear-gradient(135deg, #e91e63 0%, #9c27b0 100%);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #e91e63;
        }

        .purchase-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .purchase-item {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .purchase-item input {
            flex: 1;
        }

        .purchase-number {
            background: linear-gradient(135deg, #e91e63 0%, #9c27b0 100%);
            color: white;
            min-width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        button {
            background: linear-gradient(135deg, #e91e63 0%, #9c27b0 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.4);
        }

        .budget-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .budget-input span {
            font-size: 1.5rem;
            color: #333;
        }

        .budget-input input {
            flex: 1;
            font-size: 1.2rem;
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .analysis {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .analysis h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .analysis p {
            color: #666;
            line-height: 1.6;
        }

        .detected-interests {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .interest-tag {
            background: linear-gradient(135deg, #e91e63 0%, #9c27b0 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .gift-idea {
            background: linear-gradient(135deg, #fff5f8 0%, #fdf4ff 100%);
            border: 2px solid #e91e63;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .gift-idea h3 {
            color: #e91e63;
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .gift-idea .reason {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .gift-idea .based-on {
            font-size: 0.85rem;
            color: #888;
            font-style: italic;
        }

        .gift-idea .price-estimate {
            margin-top: 10px;
            font-weight: bold;
            color: #9c27b0;
        }

        .reset-btn {
            background: #666;
            margin-top: 20px;
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Gift Suggester</h1>
            <p>Get personalized gift ideas based on their recent purchases</p>
        </header>

        <form id="suggesterForm">
            <div class="card">
                <h2><span class="step-number">1</span> Enter Their Last 5 Purchases</h2>
                <p style="color: #666; margin-bottom: 20px;">What has your significant other bought recently? Be specific!</p>
                <div class="purchase-list">
                    <div class="purchase-item">
                        <span class="purchase-number">1</span>
                        <input type="text" id="purchase1" placeholder="e.g., Running shoes from Nike" required>
                    </div>
                    <div class="purchase-item">
                        <span class="purchase-number">2</span>
                        <input type="text" id="purchase2" placeholder="e.g., Cookbook for Italian recipes" required>
                    </div>
                    <div class="purchase-item">
                        <span class="purchase-number">3</span>
                        <input type="text" id="purchase3" placeholder="e.g., Wireless headphones" required>
                    </div>
                    <div class="purchase-item">
                        <span class="purchase-number">4</span>
                        <input type="text" id="purchase4" placeholder="e.g., Yoga mat" required>
                    </div>
                    <div class="purchase-item">
                        <span class="purchase-number">5</span>
                        <input type="text" id="purchase5" placeholder="e.g., Scented candles" required>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2><span class="step-number">2</span> What's Your Budget?</h2>
                <p style="color: #666; margin-bottom: 20px;">How much do you want to spend on this gift?</p>
                <div class="budget-input">
                    <span>$</span>
                    <input type="number" id="budget" placeholder="Enter amount" min="1" required>
                </div>
            </div>

            <div class="card">
                <button type="submit">Generate Gift Ideas</button>
            </div>
        </form>

        <div class="results card" id="results">
            <h2>Your Personalized Gift Ideas</h2>

            <div class="analysis" id="analysis"></div>

            <div id="giftIdeas"></div>

            <button type="button" class="reset-btn" onclick="resetForm()">Start Over</button>
        </div>
    </div>

    <script>
        // Keywords mapped to interests/themes
        const interestKeywords = {
            fitness: ['running', 'shoes', 'nike', 'adidas', 'gym', 'workout', 'exercise', 'yoga', 'sports', 'athletic', 'fitness', 'weights', 'training', 'marathon', 'cycling', 'bike', 'swimming', 'hiking', 'outdoor'],
            cooking: ['cookbook', 'kitchen', 'cooking', 'recipe', 'chef', 'baking', 'food', 'culinary', 'pan', 'pot', 'knife', 'utensil', 'spice', 'ingredient', 'gourmet'],
            music: ['headphones', 'earbuds', 'speaker', 'music', 'vinyl', 'record', 'guitar', 'piano', 'instrument', 'concert', 'spotify', 'audio', 'sound'],
            technology: ['phone', 'laptop', 'tablet', 'computer', 'gadget', 'tech', 'smart', 'wireless', 'bluetooth', 'electronic', 'gaming', 'console', 'app'],
            reading: ['book', 'novel', 'reading', 'kindle', 'literature', 'magazine', 'journal', 'diary', 'writing', 'author', 'poetry'],
            wellness: ['yoga', 'meditation', 'candle', 'spa', 'relaxation', 'aromatherapy', 'essential oil', 'skincare', 'self-care', 'bath', 'massage', 'wellness'],
            fashion: ['clothes', 'dress', 'shirt', 'jeans', 'jacket', 'fashion', 'accessory', 'jewelry', 'watch', 'bag', 'purse', 'shoes', 'boots', 'scarf', 'hat'],
            art: ['paint', 'canvas', 'art', 'craft', 'drawing', 'sketch', 'creative', 'pottery', 'sculpture', 'gallery', 'museum', 'design'],
            travel: ['luggage', 'suitcase', 'travel', 'passport', 'trip', 'vacation', 'adventure', 'backpack', 'camping', 'hotel', 'flight'],
            gardening: ['plant', 'garden', 'flower', 'seed', 'pot', 'succulent', 'herb', 'outdoor', 'nature', 'green'],
            photography: ['camera', 'photo', 'photography', 'lens', 'tripod', 'film', 'polaroid', 'picture', 'portrait'],
            gaming: ['game', 'gaming', 'playstation', 'xbox', 'nintendo', 'switch', 'controller', 'video game', 'console'],
            coffee: ['coffee', 'espresso', 'latte', 'cafe', 'mug', 'beans', 'grinder', 'barista', 'tea'],
            wine: ['wine', 'champagne', 'cocktail', 'bar', 'whiskey', 'spirits', 'brewery', 'beer', 'sommelier']
        };

        // Gift ideas generated based on detected interests
        const giftGenerators = {
            fitness: (budget, purchases) => [
                { name: 'Premium Fitness Subscription', reason: 'Since they\'re into fitness gear, a premium workout app subscription or online training program would complement their active lifestyle.', minPrice: 30, maxPrice: 200 },
                { name: 'Recovery Massage Gun', reason: 'After all that exercise, a quality massage gun will help with muscle recovery and show you care about their wellbeing.', minPrice: 80, maxPrice: 300 },
                { name: 'Smart Water Bottle', reason: 'An insulated smart bottle that tracks hydration would be perfect for someone who takes fitness seriously.', minPrice: 25, maxPrice: 60 },
                { name: 'Fitness Tracking Watch', reason: 'A smartwatch to track workouts, heart rate, and progress would be an upgrade they\'ll use daily.', minPrice: 100, maxPrice: 400 }
            ],
            cooking: (budget, purchases) => [
                { name: 'Cooking Class Experience', reason: 'Based on their interest in cooking, a hands-on class with a professional chef would be an unforgettable experience.', minPrice: 75, maxPrice: 250 },
                { name: 'High-End Kitchen Gadget', reason: 'A quality stand mixer, food processor, or sous vide machine would elevate their cooking game.', minPrice: 100, maxPrice: 400 },
                { name: 'Artisanal Spice Collection', reason: 'A curated collection of exotic spices from around the world to inspire new recipes.', minPrice: 40, maxPrice: 120 },
                { name: 'Personalized Cutting Board', reason: 'A beautiful custom-engraved wooden cutting board they\'ll treasure in their kitchen.', minPrice: 50, maxPrice: 150 }
            ],
            music: (budget, purchases) => [
                { name: 'Concert Tickets', reason: 'They clearly love music - surprise them with tickets to see their favorite artist live!', minPrice: 50, maxPrice: 500 },
                { name: 'Vinyl Record Subscription', reason: 'A monthly vinyl subscription service delivering curated records to their door.', minPrice: 25, maxPrice: 100 },
                { name: 'Premium Headphone Stand', reason: 'A beautiful stand to display and organize their audio gear.', minPrice: 30, maxPrice: 80 },
                { name: 'Portable Hi-Fi DAC', reason: 'Upgrade their listening experience with a quality digital-to-analog converter.', minPrice: 100, maxPrice: 300 }
            ],
            technology: (budget, purchases) => [
                { name: 'Smart Home Device', reason: 'They\'re into tech - a smart display, smart plugs, or voice assistant would fit right in.', minPrice: 50, maxPrice: 250 },
                { name: 'Wireless Charging Station', reason: 'A sleek multi-device charging pad to keep all their gadgets powered up.', minPrice: 40, maxPrice: 120 },
                { name: 'Tech Accessory Kit', reason: 'A premium set of cables, adapters, and organizers for the tech enthusiast.', minPrice: 30, maxPrice: 100 },
                { name: 'Portable Power Bank', reason: 'A high-capacity power bank so they\'re never without a charge on the go.', minPrice: 40, maxPrice: 150 }
            ],
            reading: (budget, purchases) => [
                { name: 'E-Reader Device', reason: 'For the book lover, an e-reader means they can carry their entire library anywhere.', minPrice: 100, maxPrice: 300 },
                { name: 'Book Subscription Box', reason: 'Monthly curated books delivered with bookish goodies based on their preferences.', minPrice: 30, maxPrice: 80 },
                { name: 'Cozy Reading Accessories', reason: 'A beautiful book light, premium bookmark set, and cozy reading blanket bundle.', minPrice: 40, maxPrice: 120 },
                { name: 'Signed First Edition', reason: 'Track down a signed copy from their favorite author - a true collector\'s item.', minPrice: 50, maxPrice: 500 }
            ],
            wellness: (budget, purchases) => [
                { name: 'Spa Day Package', reason: 'They\'re clearly into self-care - treat them to a professional spa experience.', minPrice: 100, maxPrice: 400 },
                { name: 'Meditation App Subscription', reason: 'A premium meditation app with guided sessions, sleep stories, and relaxation music.', minPrice: 50, maxPrice: 100 },
                { name: 'Luxury Aromatherapy Set', reason: 'An essential oil diffuser with a collection of premium therapeutic oils.', minPrice: 60, maxPrice: 150 },
                { name: 'Weighted Blanket', reason: 'A cozy weighted blanket for ultimate relaxation and better sleep.', minPrice: 80, maxPrice: 200 }
            ],
            fashion: (budget, purchases) => [
                { name: 'Personal Styling Session', reason: 'A session with a professional stylist to refresh their wardrobe.', minPrice: 100, maxPrice: 300 },
                { name: 'Quality Leather Accessory', reason: 'A beautiful leather wallet, bag, or belt that will age beautifully.', minPrice: 75, maxPrice: 350 },
                { name: 'Jewelry Piece', reason: 'A meaningful piece of jewelry they can wear every day and think of you.', minPrice: 50, maxPrice: 500 },
                { name: 'Designer Sunglasses', reason: 'A stylish pair of quality sunglasses they\'ll reach for year-round.', minPrice: 100, maxPrice: 400 }
            ],
            art: (budget, purchases) => [
                { name: 'Art Class or Workshop', reason: 'Since they\'re creative, a pottery, painting, or craft workshop would be inspiring.', minPrice: 50, maxPrice: 200 },
                { name: 'Premium Art Supply Set', reason: 'Professional-grade supplies to take their creativity to the next level.', minPrice: 60, maxPrice: 250 },
                { name: 'Custom Portrait Commission', reason: 'Commission an artist to create a portrait of you two together.', minPrice: 100, maxPrice: 500 },
                { name: 'Museum Membership', reason: 'Annual membership to their favorite art museum with special exhibition access.', minPrice: 75, maxPrice: 200 }
            ],
            travel: (budget, purchases) => [
                { name: 'Weekend Getaway', reason: 'Plan a surprise trip to somewhere they\'ve always wanted to go!', minPrice: 200, maxPrice: 1000 },
                { name: 'Premium Travel Accessories', reason: 'A packing cube set, travel pillow, or noise-canceling headphones for their adventures.', minPrice: 50, maxPrice: 200 },
                { name: 'Experience Voucher', reason: 'A voucher for a local adventure - hot air balloon, zip-lining, or food tour.', minPrice: 75, maxPrice: 300 },
                { name: 'Personalized Travel Journal', reason: 'A beautiful leather-bound journal to document their adventures.', minPrice: 40, maxPrice: 100 }
            ],
            gardening: (budget, purchases) => [
                { name: 'Indoor Herb Garden Kit', reason: 'A smart indoor garden system to grow fresh herbs year-round.', minPrice: 80, maxPrice: 200 },
                { name: 'Rare Plant or Bouquet Subscription', reason: 'Monthly delivery of beautiful flowers or a rare houseplant they\'ll love.', minPrice: 40, maxPrice: 150 },
                { name: 'Quality Garden Tools', reason: 'A set of premium, ergonomic garden tools that will last for years.', minPrice: 50, maxPrice: 180 },
                { name: 'Botanical Art Print', reason: 'Beautiful botanical illustrations to bring nature indoors.', minPrice: 30, maxPrice: 150 }
            ],
            photography: (budget, purchases) => [
                { name: 'Photo Printing Service Credit', reason: 'Credit for a premium printing service to turn their photos into art.', minPrice: 50, maxPrice: 200 },
                { name: 'Camera Accessories Kit', reason: 'A quality camera strap, lens filters, or memory cards to enhance their setup.', minPrice: 40, maxPrice: 150 },
                { name: 'Photo Book of Your Memories', reason: 'Create a beautiful custom photo book of your best moments together.', minPrice: 60, maxPrice: 200 },
                { name: 'Photography Workshop', reason: 'A class to learn new techniques from a professional photographer.', minPrice: 100, maxPrice: 300 }
            ],
            gaming: (budget, purchases) => [
                { name: 'Gaming Headset', reason: 'A quality headset with great audio and a good mic for their gaming sessions.', minPrice: 60, maxPrice: 250 },
                { name: 'Game Subscription Service', reason: 'A year of Xbox Game Pass, PlayStation Plus, or Nintendo Online.', minPrice: 60, maxPrice: 120 },
                { name: 'Gaming Chair or Accessories', reason: 'Upgrade their setup with a comfortable chair or LED lighting.', minPrice: 100, maxPrice: 400 },
                { name: 'Collectible or Merchandise', reason: 'Limited edition merchandise from their favorite game franchise.', minPrice: 30, maxPrice: 200 }
            ],
            coffee: (budget, purchases) => [
                { name: 'Premium Coffee Subscription', reason: 'Monthly deliveries of specialty beans from roasters around the world.', minPrice: 30, maxPrice: 100 },
                { name: 'Quality Coffee Equipment', reason: 'A pour-over set, French press, or espresso machine upgrade.', minPrice: 50, maxPrice: 400 },
                { name: 'Barista Class', reason: 'Learn the art of espresso and latte art from a professional barista.', minPrice: 75, maxPrice: 200 },
                { name: 'Artisanal Coffee Set', reason: 'A curated set of rare single-origin coffees with tasting notes.', minPrice: 40, maxPrice: 120 }
            ],
            wine: (budget, purchases) => [
                { name: 'Wine Tasting Experience', reason: 'A visit to a local winery or a guided wine tasting dinner.', minPrice: 75, maxPrice: 250 },
                { name: 'Wine Club Membership', reason: 'Monthly deliveries of curated wines to explore together.', minPrice: 50, maxPrice: 150 },
                { name: 'Wine Accessories Set', reason: 'Premium aerator, quality glasses, or a beautiful wine rack.', minPrice: 40, maxPrice: 200 },
                { name: 'Rare or Special Vintage', reason: 'A bottle from a significant year - like when you met or their birth year.', minPrice: 50, maxPrice: 500 }
            ]
        };

        function detectInterests(purchases) {
            const detectedInterests = {};
            const purchaseTexts = purchases.map(p => p.toLowerCase());

            for (const [interest, keywords] of Object.entries(interestKeywords)) {
                let matchCount = 0;
                const matchedPurchases = [];

                for (const purchase of purchaseTexts) {
                    for (const keyword of keywords) {
                        if (purchase.includes(keyword)) {
                            matchCount++;
                            if (!matchedPurchases.includes(purchase)) {
                                matchedPurchases.push(purchase);
                            }
                            break;
                        }
                    }
                }

                if (matchCount > 0) {
                    detectedInterests[interest] = { count: matchCount, purchases: matchedPurchases };
                }
            }

            return detectedInterests;
        }

        function generateGiftIdeas(interests, budget, purchases) {
            const ideas = [];
            const sortedInterests = Object.entries(interests).sort((a, b) => b[1].count - a[1].count);

            for (const [interest, data] of sortedInterests) {
                if (giftGenerators[interest]) {
                    const interestGifts = giftGenerators[interest](budget, data.purchases);

                    for (const gift of interestGifts) {
                        if (budget >= gift.minPrice && !ideas.find(i => i.name === gift.name)) {
                            ideas.push({
                                ...gift,
                                interest,
                                basedOn: data.purchases
                            });
                        }
                    }
                }
            }

            // Sort by how well they fit the budget (prefer gifts that use more of the budget without exceeding)
            ideas.sort((a, b) => {
                const aFit = Math.min(budget, a.maxPrice) / budget;
                const bFit = Math.min(budget, b.maxPrice) / budget;
                return bFit - aFit;
            });

            return ideas.slice(0, 4);
        }

        function formatInterestName(interest) {
            return interest.charAt(0).toUpperCase() + interest.slice(1);
        }

        document.getElementById('suggesterForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const purchases = [];
            for (let i = 1; i <= 5; i++) {
                const value = document.getElementById(`purchase${i}`).value.trim();
                if (value) purchases.push(value);
            }

            const budget = parseFloat(document.getElementById('budget').value);

            if (purchases.length < 5) {
                alert('Please enter all 5 purchases.');
                return;
            }

            if (!budget || budget <= 0) {
                alert('Please enter a valid budget.');
                return;
            }

            const interests = detectInterests(purchases);
            const ideas = generateGiftIdeas(interests, budget, purchases);

            // Display analysis
            const analysisDiv = document.getElementById('analysis');
            const interestNames = Object.keys(interests);

            if (interestNames.length > 0) {
                analysisDiv.innerHTML = `
                    <h4>What We Learned About Them</h4>
                    <p>Based on their purchases, they seem to be interested in:</p>
                    <div class="detected-interests">
                        ${interestNames.map(i => `<span class="interest-tag">${formatInterestName(i)}</span>`).join('')}
                    </div>
                `;
            } else {
                analysisDiv.innerHTML = `
                    <h4>Generating Ideas</h4>
                    <p>We're creating unique suggestions based on their specific purchases.</p>
                `;
            }

            // Display gift ideas
            const ideasDiv = document.getElementById('giftIdeas');

            if (ideas.length === 0) {
                ideasDiv.innerHTML = `
                    <div class="no-results">
                        <h3>No matches found</h3>
                        <p>Try entering more specific purchase descriptions or adjusting your budget.</p>
                    </div>
                `;
            } else {
                ideasDiv.innerHTML = ideas.map((idea, index) => `
                    <div class="gift-idea">
                        <h3>${index + 1}. ${idea.name}</h3>
                        <p class="reason">${idea.reason}</p>
                        <p class="based-on">Based on: "${idea.basedOn[0]}"</p>
                        <p class="price-estimate">Estimated: $${idea.minPrice} - $${Math.min(idea.maxPrice, budget)}</p>
                    </div>
                `).join('');
            }

            document.getElementById('results').classList.add('show');
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        });

        function resetForm() {
            document.getElementById('suggesterForm').reset();
            document.getElementById('results').classList.remove('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
