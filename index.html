<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftGiver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .gift-list {
            list-style: none;
        }

        .gift-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: background-color 0.2s;
        }

        .gift-item:hover {
            background-color: #f8f9fa;
        }

        .gift-info h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .gift-info p {
            color: #666;
            font-size: 0.9rem;
        }

        .gift-meta {
            text-align: right;
        }

        .gift-price {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1rem;
        }

        .gift-recipient {
            font-size: 0.85rem;
            color: #888;
        }

        .gift-actions button {
            background: #dc3545;
            padding: 8px 12px;
            font-size: 0.85rem;
            margin-left: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .gift-item {
                flex-direction: column;
                text-align: center;
            }

            .gift-meta {
                text-align: center;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>GiftGiver</h1>
            <p>Keep track of gift ideas for your loved ones</p>
        </header>

        <div class="card">
            <h2>Add a Gift Idea</h2>
            <form id="giftForm">
                <div class="form-group">
                    <label for="giftName">Gift Name</label>
                    <input type="text" id="giftName" placeholder="e.g., Wireless Headphones" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="recipient">Recipient</label>
                        <input type="text" id="recipient" placeholder="e.g., Mom" required>
                    </div>
                    <div class="form-group">
                        <label for="price">Price ($)</label>
                        <input type="number" id="price" placeholder="0.00" min="0" step="0.01">
                    </div>
                </div>
                <div class="form-group">
                    <label for="occasion">Occasion</label>
                    <select id="occasion">
                        <option value="birthday">Birthday</option>
                        <option value="christmas">Christmas</option>
                        <option value="anniversary">Anniversary</option>
                        <option value="valentines">Valentine's Day</option>
                        <option value="mothers-day">Mother's Day</option>
                        <option value="fathers-day">Father's Day</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="notes">Notes (optional)</label>
                    <textarea id="notes" rows="2" placeholder="Any additional details..."></textarea>
                </div>
                <button type="submit">Add Gift</button>
            </form>
        </div>

        <div class="card">
            <h2>Gift Ideas</h2>
            <ul class="gift-list" id="giftList">
                <li class="empty-state">No gift ideas yet. Add one above!</li>
            </ul>
        </div>
    </div>

    <script>
        let gifts = JSON.parse(localStorage.getItem('gifts')) || [];

        function saveGifts() {
            localStorage.setItem('gifts', JSON.stringify(gifts));
        }

        function renderGifts() {
            const giftList = document.getElementById('giftList');

            if (gifts.length === 0) {
                giftList.innerHTML = '<li class="empty-state">No gift ideas yet. Add one above!</li>';
                return;
            }

            giftList.innerHTML = gifts.map((gift, index) => `
                <li class="gift-item">
                    <div class="gift-info">
                        <h3>${escapeHtml(gift.name)}</h3>
                        <p>${escapeHtml(gift.occasion)}${gift.notes ? ' - ' + escapeHtml(gift.notes) : ''}</p>
                    </div>
                    <div class="gift-meta">
                        <div class="gift-price">${gift.price ? '$' + parseFloat(gift.price).toFixed(2) : 'No price'}</div>
                        <div class="gift-recipient">For: ${escapeHtml(gift.recipient)}</div>
                    </div>
                    <div class="gift-actions">
                        <button onclick="deleteGift(${index})">Remove</button>
                    </div>
                </li>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function deleteGift(index) {
            gifts.splice(index, 1);
            saveGifts();
            renderGifts();
        }

        document.getElementById('giftForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const gift = {
                name: document.getElementById('giftName').value,
                recipient: document.getElementById('recipient').value,
                price: document.getElementById('price').value,
                occasion: document.getElementById('occasion').value,
                notes: document.getElementById('notes').value
            };

            gifts.push(gift);
            saveGifts();
            renderGifts();
            this.reset();
        });

        renderGifts();
    </script>
</body>
</html>
