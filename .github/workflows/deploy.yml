name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/wizardly-hawking-7YOMq
      - claude/init-giftgiver-repo-1xwQr
      - main
      - master
  workflow_dispatch:

# Need write access to push the built site to the gh-pages branch
permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Assets are served from https://<user>.github.io/GiftGiver/
          VITE_BASE: /GiftGiver/

      - name: Publish to gh-pages branch
        run: |
          cd dist
          touch .nojekyll            # serve files/dirs that start with "_"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git branch -M gh-pages
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
